<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Space badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Subtle stars -->
  <circle cx="13" cy="14" r="1.2" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="51" cy="13" r="1.1" fill="#bae6fd" opacity="0.7"/>
  <circle cx="14" cy="50" r="1.1" fill="#7dd3fc" opacity="0.65"/>

  <!-- Satellite tilted at -45 deg -->
  <g transform="rotate(-45 32 30)">
    <!-- Left solar wing -->
    <rect x="4" y="21" width="18" height="14" rx="2.5" fill="url(#panel)" stroke="#bae6fd" stroke-width="1.6"/>
    <line x1="10" y1="21" x2="10" y2="35" stroke="#e0f2fe" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="16" y1="21" x2="16" y2="35" stroke="#e0f2fe" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="4" y1="28" x2="22" y2="28" stroke="#e0f2fe" stroke-opacity="0.55" stroke-width="1.2"/>

    <!-- Right solar wing -->
    <rect x="42" y="21" width="18" height="14" rx="2.5" fill="url(#panel)" stroke="#bae6fd" stroke-width="1.6"/>
    <line x1="48" y1="21" x2="48" y2="35" stroke="#e0f2fe" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="54" y1="21" x2="54" y2="35" stroke="#e0f2fe" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="42" y1="28" x2="60" y2="28" stroke="#e0f2fe" stroke-opacity="0.55" stroke-width="1.2"/>

    <!-- Connecting struts -->
    <rect x="22" y="26.5" width="4" height="3" fill="#cbd5e1"/>
    <rect x="38" y="26.5" width="4" height="3" fill="#cbd5e1"/>

    <!-- Satellite central body -->
    <rect x="25" y="19" width="14" height="18" rx="3" fill="url(#body)" stroke="#ffffff" stroke-width="1.4"/>
    <circle cx="32" cy="26" r="3" fill="#0ea5e9" stroke="#e0f2fe" stroke-width="1.2"/>

    <!-- Dish antenna pointing down -->
    <line x1="32" y1="37" x2="32" y2="41.5" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M25 41.5 Q32 47.5 39 41.5" fill="none" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="32" cy="44.5" r="1.7" fill="#34d399"/>
  </g>

  <!-- Signal waves toward Earth (bottom-right) -->
  <path d="M40 48 A9 9 0 0 0 49 39" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
  <path d="M43 54 A15 15 0 0 0 55 42" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" opacity="0.82"/>
</svg>
